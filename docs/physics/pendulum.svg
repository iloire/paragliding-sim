<svg xmlns="http://www.w3.org/2000/svg" width="760" height="440" viewBox="0 0 760 440" font-family="-apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" role="img" aria-label="The two pendulums: pitch and roll">
  <style>
    .title { font-size: 17px; font-weight: 600; fill: #0b0b0b; }
    .sub { font-size: 13px; fill: #52514e; }
    .h { font-size: 14px; font-weight: 600; fill: #0b0b0b; }
    .lbl { font-size: 12.5px; fill: #0b0b0b; paint-order: stroke; stroke: #fcfcfb; stroke-width: 4px; }
    .note { font-size: 12px; fill: #52514e; }
  </style>
  <defs>
    <marker id="ink" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#0b0b0b"/></marker>
    <marker id="blue" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#2a78d6"/></marker>
  </defs>
  <rect width="100%" height="100%" rx="10" fill="#fcfcfb"/>
  <text x="20" y="30" class="title">The pilot hangs ~7 m under the wing: two pendulums</text>
  <text x="20" y="52" class="sub">The sim does not model the two bodies. It gives the wing's pitch (as CL) and its bank damped spring dynamics instead.</text>
  <line x1="380" y1="72" x2="380" y2="420" stroke="#e7e6e2"/>

  <!-- PITCH (side view) -->
  <text x="20" y="84" class="h">Pitch: the wing swings fore and aft</text>
  <g>
    <line x1="195" y1="350" x2="120" y2="165" stroke="#c9c8c2"/>
    <line x1="195" y1="350" x2="270" y2="165" stroke="#c9c8c2"/>
    <line x1="195" y1="350" x2="195" y2="150" stroke="#9a9993"/>
    <ellipse cx="120" cy="165" rx="40" ry="8" transform="rotate(-22 120 165)" fill="#f1f0ec" stroke="#c9c8c2"/>
    <ellipse cx="270" cy="165" rx="40" ry="8" transform="rotate(22 270 165)" fill="#f1f0ec" stroke="#c9c8c2"/>
    <ellipse cx="195" cy="150" rx="40" ry="8" fill="#e7e6e2" stroke="#9a9993"/>
    <path d="M 110.7 141.4 A 225 225 0 0 1 279.3 141.4" fill="none" stroke="#2a78d6" stroke-width="2" marker-start="url(#blue)" marker-end="url(#blue)"/>
    <text x="96" y="120" class="lbl" text-anchor="middle">brakes / flare</text>
    <text x="96" y="136" class="lbl" text-anchor="middle">wing behind</text>
    <text x="195" y="110" class="lbl" text-anchor="middle">trim</text>
    <text x="294" y="120" class="lbl" text-anchor="middle">surge</text>
    <text x="294" y="136" class="lbl" text-anchor="middle">wing ahead</text>
    <circle cx="195" cy="350" r="7" fill="#0b0b0b"/>
    <line x1="150" y1="378" x2="250" y2="378" stroke="#0b0b0b" stroke-width="1.5" marker-end="url(#ink)"/>
    <text x="200" y="372" class="note" text-anchor="middle">direction of flight</text>
  </g>
  <text x="20" y="402" class="note">CL follows its target through a spring–damper: ω 2.2 rad/s, ζ 0.55,</text>
  <text x="20" y="418" class="note">plus a speed-stability pull back towards trim speed.</text>

  <!-- ROLL (rear view) -->
  <text x="400" y="84" class="h">Roll: the pilot's weight levels the wing</text>
  <g>
    <line x1="565" y1="350" x2="565" y2="125" stroke="#9a9993" stroke-dasharray="4 4"/>
    <g transform="rotate(40 565 350)">
      <line x1="490" y1="178" x2="565" y2="350" stroke="#c9c8c2"/>
      <line x1="640" y1="178" x2="565" y2="350" stroke="#c9c8c2"/>
      <path d="M 485 185 Q 565 130 645 185" fill="none" stroke="#c9c8c2" stroke-width="11" stroke-linecap="round"/>
    </g>
    <path d="M 565 290 A 60 60 0 0 1 603.6 304" fill="none" stroke="#0b0b0b"/>
    <text x="577" y="280" class="lbl">μ</text>
    <path d="M 700 196 A 205 205 0 0 0 615 151" fill="none" stroke="#2a78d6" stroke-width="2" marker-end="url(#blue)"/>
    <text x="690" y="150" class="lbl" text-anchor="middle">restoring</text>
    <text x="690" y="166" class="lbl" text-anchor="middle">∝ sin μ</text>
    <circle cx="565" cy="350" r="7" fill="#0b0b0b"/>
  </g>
  <text x="400" y="386" class="note">ω 1.45 rad/s (≈ 4.3 s period), ζ 0.28: lightly damped, so it swings.</text>
  <text x="400" y="402" class="note">Past ~55° at high G the restoring term fades by spiralTendency;</text>
  <text x="400" y="418" class="note">past ~63° a steep wall pushes back (the pilot swung far out).</text>
</svg>
