<svg xmlns="http://www.w3.org/2000/svg" width="760" height="730" viewBox="0 0 760 730" font-family="-apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" role="img" aria-label="One flight-model step">
  <style>
    .title { font-size: 17px; font-weight: 600; fill: #0b0b0b; }
    .sub { font-size: 13px; fill: #52514e; }
    .box { fill: #ffffff; stroke: #9a9993; }
    .side { fill: #f1f0ec; stroke: #9a9993; }
    .h { font-size: 13px; font-weight: 600; fill: #0b0b0b; }
    .d { font-size: 12px; fill: #52514e; }
    .n { font-size: 12px; font-weight: 600; fill: #2a78d6; }
  </style>
  <defs>
    <marker id="ink" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0 L10 5 L0 10 z" fill="#52514e"/></marker>
  </defs>
  <rect width="100%" height="100%" rx="10" fill="#fcfcfb"/>
  <text x="20" y="30" class="title">One flight-model step: stepGlider(), 120 times a second</text>
  <text x="20" y="52" class="sub">In order, as fly() runs them in src/sim/glider.ts. Grey boxes on the right are the data each step reads.</text>

  <g transform="translate(0 80)">
    <g stroke="#52514e" stroke-width="1.3" marker-end="url(#ink)">
      <line x1="310" y1="46" x2="310" y2="60"/><line x1="310" y1="108" x2="310" y2="122"/>
      <line x1="310" y1="170" x2="310" y2="184"/><line x1="310" y1="232" x2="310" y2="246"/>
      <line x1="310" y1="294" x2="310" y2="308"/><line x1="310" y1="356" x2="310" y2="370"/>
      <line x1="310" y1="418" x2="310" y2="432"/><line x1="310" y1="480" x2="310" y2="494"/>
      <line x1="310" y1="542" x2="310" y2="556"/>
      <path d="M120 581 H 80 V 23 H 118" fill="none"/>
      <line x1="540" y1="96" x2="502" y2="147"/>
      <line x1="540" y1="110" x2="502" y2="271"/>
      <line x1="540" y1="210" x2="502" y2="209"/>
      <line x1="540" y1="580" x2="502" y2="581"/>
    </g>
    <text transform="translate(70 300) rotate(-90)" class="d" text-anchor="middle">next step, 1/120 s later</text>

    <g>
      <rect class="box" x="120" y="0" width="380" height="46" rx="6"/><text x="134" y="19" class="h"><tspan class="n">1</tspan><tspan dx="6">Controls</tspan></text><text x="134" y="36" class="d">brake left / right, speed bar, weight shift</text>
      <rect class="box" x="120" y="62" width="380" height="46" rx="6"/><text x="134" y="81" class="h"><tspan class="n">2</tspan><tspan dx="6">Stall check</tspan></text><text x="134" y="98" class="d">brakes &gt; 90 % or far too slow for 1.2 s → stalled</text>
      <rect class="box" x="120" y="124" width="380" height="46" rx="6"/><text x="134" y="143" class="h"><tspan class="n">3</tspan><tspan dx="6">Pitch pendulum</tspan></text><text x="134" y="160" class="d">brakes / bar → target speed → target CL → CL (spring–damper)</text>
      <rect class="box" x="120" y="186" width="380" height="46" rx="6"/><text x="134" y="205" class="h"><tspan class="n">4</tspan><tspan dx="6">Sample the air</tspan></text><text x="134" y="222" class="d">wind u, v, w at the glider; gust = w − its 1 s average</text>
      <rect class="box" x="120" y="248" width="380" height="46" rx="6"/><text x="134" y="267" class="h"><tspan class="n">5</tspan><tspan dx="6">Lift and drag</tspan></text><text x="134" y="284" class="d">L = K·V²·CL (+ gust, − collapse) → G;  D = K·V²·CD</text>
      <rect class="box" x="120" y="310" width="380" height="46" rx="6"/><text x="134" y="329" class="h"><tspan class="n">6</tspan><tspan dx="6">Roll pendulum</tspan></text><text x="134" y="346" class="d">input × authority − restoring (spiral fade, wall) → bank</text>
      <rect class="box" x="120" y="372" width="380" height="46" rx="6"/><text x="134" y="391" class="h"><tspan class="n">7</tspan><tspan dx="6">Wind-axes step</tspan></text><text x="134" y="408" class="d">update airspeed V, path angle γ, heading ψ</text>
      <rect class="box" x="120" y="434" width="380" height="46" rx="6"/><text x="134" y="453" class="h"><tspan class="n">8</tspan><tspan dx="6">Events</tspan></text><text x="134" y="470" class="d">unloaded &lt; 0.3 G → collapse;  &gt; 2.2 G and steep → spiral</text>
      <rect class="box" x="120" y="496" width="380" height="46" rx="6"/><text x="134" y="515" class="h"><tspan class="n">9</tspan><tspan dx="6">Move</tspan></text><text x="134" y="532" class="d">velocity through the air + wind → x, y, z, vario</text>
      <rect class="box" x="120" y="558" width="380" height="46" rx="6"/><text x="134" y="577" class="h"><tspan class="n">10</tspan><tspan dx="6">Ground contact</tspan></text><text x="134" y="594" class="d">launch grace, landed / crashed / water</text>
    </g>

    <g>
      <rect class="side" x="540" y="80" width="200" height="46" rx="6"/><text x="552" y="99" class="h">Polar</text><text x="552" y="116" class="d">wings.json → CL, CD, speeds</text>
      <rect class="side" x="540" y="186" width="200" height="46" rx="6"/><text x="552" y="205" class="h">WindField + thermals</text><text x="552" y="222" class="d">ridge lift, lee, turbulence</text>
      <rect class="side" x="540" y="558" width="200" height="46" rx="6"/><text x="552" y="577" class="h">Heightmap</text><text x="552" y="594" class="d">ground height, sea mask</text>
    </g>
  </g>
</svg>
