<svg xmlns="http://www.w3.org/2000/svg" width="760" height="460" viewBox="0 0 760 460" font-family="-apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" role="img" aria-label="Anatomy of a thermal">
  <style>
    .title { font-size: 17px; font-weight: 600; fill: #0b0b0b; }
    .sub { font-size: 13px; fill: #52514e; }
    .lbl { font-size: 12.5px; fill: #0b0b0b; paint-order: stroke; stroke: #fcfcfb; stroke-width: 4px; }
    .note { font-size: 12.5px; fill: #0b0b0b; }
    .b { font-weight: 600; }
  </style>
  <defs>
    <marker id="blue" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0 L10 5 L0 10 z" fill="#2a78d6"/></marker>
    <marker id="red" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0 L10 5 L0 10 z" fill="#e34948"/></marker>
    <marker id="ink" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto"><path d="M0 0 L10 5 L0 10 z" fill="#0b0b0b"/></marker>
    <linearGradient id="core" x1="0" y1="1" x2="0" y2="0">
      <stop offset="0" stop-color="#2a78d6" stop-opacity="0.12"/>
      <stop offset="0.1" stop-color="#2a78d6" stop-opacity="0.45"/>
      <stop offset="0.85" stop-color="#2a78d6" stop-opacity="0.45"/>
      <stop offset="1" stop-color="#2a78d6" stop-opacity="0.05"/>
    </linearGradient>
  </defs>
  <rect width="100%" height="100%" rx="10" fill="#fcfcfb"/>
  <text x="20" y="30" class="title">Anatomy of a thermal</text>
  <text x="20" y="52" class="sub">A rising column that triggers over land, drifts with the wind and tops out at the inversion.</text>

  <g transform="translate(0 30)">
    <!-- cloudbase -->
    <line x1="20" y1="100" x2="560" y2="100" stroke="#0b0b0b" stroke-width="1.2" stroke-dasharray="6 4"/>
    <text x="24" y="92" class="lbl">inversion = cloudbase</text>

    <!-- sink ring -->
    <polygon points="115,390 145,390 365,100 335,100" fill="#e34948" fill-opacity="0.18"/>
    <polygon points="315,390 345,390 565,100 535,100" fill="#e34948" fill-opacity="0.18"/>
    <!-- core -->
    <polygon points="192,390 268,390 488,100 412,100" fill="url(#core)"/>
    <line x1="230" y1="390" x2="450" y2="100" stroke="#2a78d6" stroke-dasharray="3 4"/>

    <g stroke="#2a78d6" stroke-width="2.2" marker-end="url(#blue)">
      <line x1="270" y1="330" x2="290" y2="290"/>
      <line x1="320" y1="265" x2="340" y2="225"/>
      <line x1="370" y1="200" x2="390" y2="160"/>
    </g>
    <g stroke="#e34948" stroke-width="1.8" marker-end="url(#red)">
      <line x1="215" y1="245" x2="210" y2="272"/>
      <line x1="440" y1="230" x2="435" y2="257"/>
    </g>

    <!-- cumulus -->
    <g fill="#ffffff" stroke="#b9b8b2">
      <circle cx="425" cy="86" r="17"/>
      <circle cx="477" cy="86" r="18"/>
      <circle cx="441" cy="68" r="19"/>
      <circle cx="464" cy="66" r="17"/>
      <circle cx="452" cy="80" r="22"/>
    </g>
    <rect x="404" y="86" width="96" height="14" fill="#ffffff"/>
    <line x1="406" y1="100" x2="498" y2="100" stroke="#b9b8b2"/>

    <!-- ground -->
    <rect x="20" y="390" width="720" height="30" fill="#d9d1c4"/>
    <ellipse cx="230" cy="392" rx="40" ry="6" fill="#b8ad9e"/>
    <text x="230" y="412" class="note" text-anchor="middle">trigger</text>

    <line x1="40" y1="160" x2="120" y2="160" stroke="#0b0b0b" stroke-width="1.5" marker-end="url(#ink)"/>
    <text x="40" y="150" class="lbl">wind</text>

    <!-- notes -->
    <g transform="translate(572 70)">
      <text class="note b" y="0">Leans downwind</text>
      <text class="note" y="17">offset = wind × time to climb</text>
      <text class="note" y="34">= wind × height ÷ strength</text>
      <text class="note b" y="70">Core</text>
      <text class="note" y="87">Gaussian, radius 50–100 m,</text>
      <text class="note" y="104">0.6–1.4 × the day's strength</text>
      <text class="note b" y="140">Sink ring</text>
      <text class="note" y="157">at ~2.2 radii, ¼ as strong</text>
      <text class="note b" y="193">Height</text>
      <text class="note" y="210">weak for the first 60 m,</text>
      <text class="note" y="227">fades in the last 150 m</text>
      <text class="note b" y="263">Life</text>
      <text class="note" y="280">6–12 min: 60 s up, 90 s down</text>
      <text class="note" y="297">24 at once, over land &gt; 30 m</text>
      <text class="note" y="314">cumulus if core ≥ 0.8 m/s</text>
    </g>
  </g>
</svg>
